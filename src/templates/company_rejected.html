<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Application Rejected</title>
</head>

<body style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
    <div
        style="max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
        <h2 style="color: #F44336;">Update on your Application</h2>
        <p>Hello {{userName}},</p>
        <p>Your company verification application for <strong>{{companyName}}</strong> has unfortunately been rejected.
        </p>

        <div style="background-color: #f9f9f9; padding: 15px; border-left: 4px solid #F44336; margin: 20px 0;">
            <p style="margin: 0; color: #555;"><strong>Reason provided:</strong></p>
            <p style="margin: 5px 0 0 0;">{{reason}}</p>
        </div>

        <p>If you believe this is an error or would like to appeal, please contact support or reply to this email.</p>
        <p style="color: #888; font-size: 12px; margin-top: 40px;">- The Admin Team</p>
    </div>
</body>

</html>
