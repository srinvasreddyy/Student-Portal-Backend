<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Company Approved</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
        <h2 style="color: #2196F3;">Welcome to the Platform, {{companyName}}!</h2>
        <p>Hello {{userName}},</p>
        <p>We are thrilled to let you know that your company profile verification has been <strong>approved</strong>.</p>
        <p>You can now log in to the dashboard and start posting projects to connect with top student talent.</p>
        
        <div style="text-align: center; margin: 30px 0;">
             <a href="{{loginLink}}" style="background-color: #2196F3; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold;">Go to Dashboard</a>
        </div>

        <p style="color: #888; font-size: 12px; margin-top: 40px;">- The Admin Team</p>
    </div>
</body>
</html>
