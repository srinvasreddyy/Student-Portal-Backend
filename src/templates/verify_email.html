<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
        <h2 style="color: #4CAF50;">Verify your email</h2>
        <p>Hello {{userName}},</p>
        <p>Thank you for signing up. Please verify your email by clicking the link below:</p>
        
        <div style="text-align: center; margin: 30px 0;">
             <a href="{{verificationLink}}" style="background-color: #4CAF50; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold;">Verify Email Address</a>
        </div>

        <p>Or use this code: <strong>{{code}}</strong></p>

        <p style="color: #888; font-size: 12px; margin-top: 40px;">If you didn't create an account, you can safely ignore this email.</p>
    </div>
</body>
</html>
