<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>You're In!</title>
</head>

<body style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
    <div
        style="max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
        <h2 style="color: #9C27B0;">Congratulations, {{userName}}!</h2>
        <p>We're thrilled to inform you that your application for <strong>{{projectTitle}}</strong> has been accepted by
            {{companyName}}.</p>
        <p>You can now join the project workspace to communicate with your team and review the next steps.</p>

        <div style="text-align: center; margin: 30px 0;">
            <a href="{{chatLink}}"
                style="background-color: #9C27B0; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-weight: bold;">Join
                Project Chat</a>
        </div>

        <p>Best of luck on your collaboration!</p>
    </div>
</body>

</html>
